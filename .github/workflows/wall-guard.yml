name: Wall guard

# Fails a pull request that would remove a name from WALL.md.
# Runs on every pull request so the check is always reported and can safely be
# marked required in branch protection; it exits early when WALL.md is untouched.
on:
  pull_request:

permissions:
  contents: read

jobs:
  wall:
    name: No names removed
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs because this org requires it
      # (sha_pinning_required). A version tag is mutable, so a compromised tag
      # could run arbitrary code in CI. SHAs match the ones already used in
      # college-materials so the org stays on one set of versions.
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Compare names against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node .github/scripts/check-wall.mjs "origin/$BASE_REF"
